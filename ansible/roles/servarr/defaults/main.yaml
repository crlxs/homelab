servarr_user: media
servarr_group: media
servarr_uid: 1500
servarr_gid: 1500
servarr_conf_dir: /opt/servarr
media_dir: /opt/media
radarr_root_folder: "{{ media_dir }}/movies"
sonarr_root_folder: "{{ media_dir }}/tv"
sabnzbd_conf_dir: "{{ servarr_conf_dir }}/sabnzbd"
sabnzbd_downloads_dir: "{{ media_dir }}/downloads"
sabnzbd_incomplete_dir: "{{ sabnzbd_downloads_dir }}/incomplete"
sabnzbd_complete_dir: "{{ sabnzbd_downloads_dir }}/complete"
sabnzbd_web_port: 8081
sabnzbd_radarr_category: radarr
sabnzbd_sonarr_category: sonarr
sabnzbd_prowlarr_category: prowlarr
sabnzbd_provider_ssl: true
sabnzbd_provider_ssl_verify: 3
sabnzbd_provider_priority: 0
timezone: Etc/UTC
servarr_ui_username: admin
# Provided through the private controller file, Vault or extra vars.
servarr_ui_password: ""

servarr_ports:
  radarr: 7878
  sonarr: 8989
  prowlarr: 9696
  sabnzbd: "{{ sabnzbd_web_port }}"
  jellyseerr: 5055
  jellyfin: 8096

# Official stable Linux binaries, downloaded only on first installation.
# Override a URL and checksum to pin an exact application release.
servarr_arr_downloads:
  radarr: https://radarr.servarr.com/v1/update/master/updatefile?os=linux&runtime=netcore&arch=x64
  # Sonarr's public download endpoint differs from Radarr/Prowlarr's updater.
  sonarr: https://services.sonarr.tv/v1/download/main/latest?version=4&os=linux&arch=x64
  prowlarr: https://prowlarr.servarr.com/v1/update/master/updatefile?os=linux&runtime=netcore&arch=x64
servarr_arr_checksums: {}

# Retain the existing Jellyseerr application rather than migrate to Seerr.
jellyseerr_version: v2.7.3
jellyseerr_pnpm_version: 9.15.9

jellyfin_conf_dir: "{{ servarr_conf_dir }}/jellyfin"
jellyfin_nvidia_enabled: true
# Empty selects NVIDIA's installer matching the detected host driver version.
jellyfin_nvidia_driver_url: ""
jellyfin_nvidia_driver_checksum: ""
jellyfin_transcode_dir: "{{ media_dir }}/transcodes/jellyfin"
jellyfin_server_name: Homelab
jellyfin_admin_username: admin
jellyfin_admin_password: "{{ servarr_ui_password }}"
jellyseerr_admin_email: admin@homelab.local
jellyseerr_radarr_quality_profile_name: HD-1080p
jellyseerr_sonarr_quality_profile_name: HD-1080p
nzbgeek_indexer_name: NZBGeek
nzbgeek_base_url: https://api.nzbgeek.info
# First-run hardware decoding defaults; override for a different NVIDIA GPU.
jellyfin_nvidia_decoding_codecs: [h264, hevc, mpeg2video, vc1, vp8, vp9, av1]
