- name: Pause and wait for manual disk configuration verification
  ansible.builtin.pause:
    prompt: |
      ---------------------------------------------------------
      Please verify that the media disk is fully configured
      and mounted on the VM.

      Press [Enter] to continue, or Ctrl+C then 'c' to cancel.
      ---------------------------------------------------------

- name: Ensure media group exists
  ansible.builtin.group:
    name: "{{ servarr_group }}"
    state: present
    system: true

- name: Ensure media user exists
  ansible.builtin.user:
    name: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    state: present
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Gather media account entries
  ansible.builtin.getent:
    database: "{{ item.database }}"
    key: "{{ item.key }}"
  loop:
    - database: passwd
      key: "{{ servarr_user }}"
    - database: group
      key: "{{ servarr_group }}"

- name: Record media account IDs for containers
  ansible.builtin.set_fact:
    servarr_puid: "{{ getent_passwd[servarr_user][2] }}"
    servarr_pgid: "{{ getent_group[servarr_group][2] }}"

- name: Ensure media disk is indeed present in the VM
  ansible.builtin.wait_for:
    path: "{{ media_disk }}"
    timeout: 30

- name: Format filesystem on the media disk
  ansible.builtin.filesystem:
    fstype: ext4
    dev: "{{ media_disk }}"
    force: false

- name: Create media directory
  ansible.builtin.file:
    path: "{{ media_dir }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "0755"

- name: Mount media directory and make permanent through /etc/fstab
  ansible.builtin.mount:
    path: "{{ media_dir }}"
    src: "{{ media_disk }}"
    fstype: ext4
    opts: defaults
    state: mounted

- name: Set ownership on media contents
  ansible.builtin.file:
    path: "{{ media_dir }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    recurse: true

- name: Set group inheritance on mounted media directory
  ansible.builtin.file:
    path: "{{ media_dir }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "2775"

- name: Create media library root folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "2775"
  loop:
    - "{{ radarr_root_folder }}"
    - "{{ sonarr_root_folder }}"
    - "{{ sabnzbd_incomplete_dir }}"
    - "{{ sabnzbd_complete_dir }}"

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ servarr_conf_dir }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "0755"

- name: Ensure SABnzbd config directory exists
  ansible.builtin.file:
    path: "{{ sabnzbd_conf_dir }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "0755"

- name: Require Servarr and SABnzbd bootstrap values
  ansible.builtin.assert:
    that:
      - servarr_ui_password | length > 0
      - sabnzbd_ui_username | length > 0
      - sabnzbd_provider_name | length > 0
      - sabnzbd_provider_host | length > 0
      - sabnzbd_provider_username | length > 0
      - sabnzbd_provider_password | length > 0
      - sabnzbd_provider_port | int > 0
      - sabnzbd_provider_connections | int > 0
      - sabnzbd_provider_port | int != 563 or sabnzbd_provider_ssl | bool
    fail_msg: Define all required Servarr and SABnzbd bootstrap values.
  no_log: true

- name: Remove obsolete on-host Servarr UI password file
  ansible.builtin.file:
    path: "{{ servarr_conf_dir }}/secrets/ui_password"
    state: absent
  no_log: true

- name: Install Servarr bootstrap script
  ansible.builtin.template:
    src: bootstrap-servarr.sh.j2
    dest: "{{ servarr_conf_dir }}/bootstrap-servarr.sh"
    owner: root
    group: root
    mode: "0755"

- name: Install Servarr Docker Compose definition
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ servarr_conf_dir }}/docker-compose.yaml"
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "0644"

- name: Start Servarr Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ servarr_conf_dir }}"
    files:
      - docker-compose.yaml
    state: present

- name: Remove legacy Servarr bootstrap container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - rm
      - --force
      - servarr-bootstrap
  register: servarr_legacy_bootstrap_container
  changed_when: servarr_legacy_bootstrap_container.rc == 0
  failed_when: servarr_legacy_bootstrap_container.rc not in [0, 1]

- name: Bootstrap Servarr and SABnzbd configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - docker-compose.yaml
      - run
      - --rm
      - --no-deps
      - -T
      - servarr-bootstrap
    chdir: "{{ servarr_conf_dir }}"
    stdin: >-
      {{ {
        "servarr_ui_password": servarr_ui_password,
        "sabnzbd_ui_username": sabnzbd_ui_username,
        "sabnzbd_ui_password": servarr_ui_password,
        "sabnzbd_incomplete_dir": sabnzbd_incomplete_dir,
        "sabnzbd_complete_dir": sabnzbd_complete_dir,
        "sabnzbd_radarr_category": sabnzbd_radarr_category,
        "sabnzbd_sonarr_category": sabnzbd_sonarr_category,
        "sabnzbd_prowlarr_category": sabnzbd_prowlarr_category,
        "sabnzbd_provider_name": sabnzbd_provider_name,
        "sabnzbd_provider_host": sabnzbd_provider_host,
        "sabnzbd_provider_port": sabnzbd_provider_port,
        "sabnzbd_provider_username": sabnzbd_provider_username,
        "sabnzbd_provider_password": sabnzbd_provider_password,
        "sabnzbd_provider_connections": sabnzbd_provider_connections,
        "sabnzbd_provider_ssl": sabnzbd_provider_ssl,
        "sabnzbd_provider_ssl_verify": sabnzbd_provider_ssl_verify,
        "sabnzbd_provider_priority": sabnzbd_provider_priority
      } | to_json }}
    stdin_add_newline: true
  changed_when: false
  no_log: true
