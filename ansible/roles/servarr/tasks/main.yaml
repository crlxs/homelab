- name: Require a supported native Debian LXC
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_major_version == '13'
      - ansible_architecture == 'x86_64'
      - servarr_ct.name in ['radarr', 'sonarr', 'prowlarr', 'sabnzbd', 'jellyseerr', 'jellyfin']

- name: Install common runtime and monitoring packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, jq, tzdata, prometheus-node-exporter]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read existing guest media accounts
  ansible.builtin.getent:
    database: "{{ item.database }}"
    key: "{{ item.key }}"
    fail_key: false
  loop:
    - database: passwd
      key: "{{ servarr_user }}"
    - database: group
      key: "{{ servarr_group }}"

- name: Refuse to renumber guest media accounts
  ansible.builtin.assert:
    that:
      - getent_passwd[servarr_user] == none or getent_passwd[servarr_user][1] | int == servarr_uid | int
      - getent_group[servarr_group] == none or getent_group[servarr_group][1] | int == servarr_gid | int

- name: Create the shared guest media group
  ansible.builtin.group:
    name: "{{ servarr_group }}"
    gid: "{{ servarr_gid }}"

- name: Create the shared guest media user
  ansible.builtin.user:
    name: "{{ servarr_user }}"
    uid: "{{ servarr_uid }}"
    group: "{{ servarr_group }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Create application data directory
  ansible.builtin.file:
    path: "{{ servarr_conf_dir }}/{{ servarr_ct.name }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: '0750'

- name: Check shared media permissions as the service account
  ansible.builtin.command:
    argv: [runuser, -u, "{{ servarr_user }}", --, test, -w, "{{ item }}"]
  loop: ["{{ radarr_root_folder }}", "{{ sonarr_root_folder }}", "{{ sabnzbd_incomplete_dir }}", "{{ sabnzbd_complete_dir }}"]
  when: servarr_ct.media
  changed_when: false

- name: Install native Servarr binaries
  ansible.builtin.include_tasks: arr.yaml
  when: servarr_ct.name in ['radarr', 'sonarr', 'prowlarr']

- name: Check Jellyfin transcoding directory permissions as media
  ansible.builtin.command:
    argv: [runuser, -u, "{{ servarr_user }}", --, test, -w, "{{ jellyfin_transcode_dir }}"]
  when: servarr_ct.name == 'jellyfin'
  changed_when: false

- name: Install SABnzbd from Debian backports
  ansible.builtin.include_tasks: sabnzbd.yaml
  when: servarr_ct.name == 'sabnzbd'

- name: Install Jellyseerr from its pinned source release
  ansible.builtin.include_tasks: jellyseerr.yaml
  when: servarr_ct.name == 'jellyseerr'

- name: Install Jellyfin and matching NVIDIA userspace drivers
  ansible.builtin.include_tasks: jellyfin.yaml
  when: servarr_ct.name == 'jellyfin'

- name: Install application service unit
  ansible.builtin.template:
    src: servarr.service.j2
    dest: "/etc/systemd/system/{{ servarr_ct.name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Restart native Servarr application

- name: Apply pending service changes before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Enable and start the native application
  ansible.builtin.systemd_service:
    name: "{{ servarr_ct.name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start guest metrics exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Wait for application HTTP readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ servarr_ports[servarr_ct.name] }}{{ '/ping' if servarr_ct.name in ['radarr', 'sonarr', 'prowlarr'] else '/' }}"
    status_code: [200, 302, 401]
  register: servarr_readiness
  until: servarr_readiness is succeeded
  retries: 60
  delay: 2

- name: Wait for generated Servarr configuration
  ansible.builtin.wait_for:
    path: "{{ servarr_conf_dir }}/{{ servarr_ct.name }}/config.xml"
    timeout: 120
  when: servarr_ct.name in ['radarr', 'sonarr', 'prowlarr']

- name: Read generated Servarr API key in memory
  ansible.builtin.slurp:
    src: "{{ servarr_conf_dir }}/{{ servarr_ct.name }}/config.xml"
  register: servarr_arr_config
  when: servarr_ct.name in ['radarr', 'sonarr', 'prowlarr']
  no_log: true

- name: Record Servarr API key for bootstrap
  ansible.builtin.set_fact:
    servarr_api_key: "{{ servarr_arr_config.content | b64decode | regex_findall('<ApiKey>([^<]+)</ApiKey>') | first }}"
  when: servarr_ct.name in ['radarr', 'sonarr', 'prowlarr']
  no_log: true

- name: Read the generated Jellyseerr settings in memory
  ansible.builtin.slurp:
    src: "{{ servarr_conf_dir }}/jellyseerr/settings.json"
  register: servarr_jellyseerr_settings
  when: servarr_ct.name == 'jellyseerr'
  no_log: true

- name: Record the Jellyseerr API key for linking services
  ansible.builtin.set_fact:
    servarr_api_key: "{{ (servarr_jellyseerr_settings.content | b64decode | from_json).main.apiKey }}"
  when: servarr_ct.name == 'jellyseerr'
  no_log: true
