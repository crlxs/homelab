- name: Pause and wait for manual disk configuration verification
  ansible.builtin.pause:
    prompt: |
      ---------------------------------------------------------
      Please verify that the media disk is fully configured
      and mounted on the VM.

      Press [Enter] to continue, or Ctrl+C then 'c' to cancel.
      ---------------------------------------------------------

- name: Ensure media group exists
  ansible.builtin.group:
    name: "{{ servarr_group }}"
    state: present
    system: true

- name: Ensure media user exists
  ansible.builtin.user:
    name: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    state: present
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Gather media account entries
  ansible.builtin.getent:
    database: "{{ item.database }}"
    key: "{{ item.key }}"
  loop:
    - database: passwd
      key: "{{ servarr_user }}"
    - database: group
      key: "{{ servarr_group }}"

- name: Record media account IDs for containers
  ansible.builtin.set_fact:
    servarr_puid: "{{ getent_passwd[servarr_user][2] }}"
    servarr_pgid: "{{ getent_group[servarr_group][2] }}"

- name: Ensure media disk is indeed present in the VM
  ansible.builtin.wait_for:
    path: "{{ media_disk }}"
    timeout: 30

- name: Format filesystem on the media disk
  ansible.builtin.filesystem:
    fstype: ext4
    dev: "{{ media_disk }}"
    force: false

- name: Create media directory
  ansible.builtin.file:
    path: "{{ media_dir }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "0755"

- name: Mount media directory and make permanent through /etc/fstab
  ansible.builtin.mount:
    path: "{{ media_dir }}"
    src: "{{ media_disk }}"
    fstype: ext4
    opts: defaults
    state: mounted

- name: Set ownership on media contents
  ansible.builtin.file:
    path: "{{ media_dir }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    recurse: true

- name: Set group inheritance on mounted media directory
  ansible.builtin.file:
    path: "{{ media_dir }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "2775"

- name: Create media library root folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "2775"
  loop:
    - "{{ radarr_root_folder }}"
    - "{{ sonarr_root_folder }}"

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ servarr_conf_dir }}"
    state: directory
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "0755"

- name: Require a Servarr UI password
  ansible.builtin.assert:
    that: servarr_ui_password | length > 0
    fail_msg: Define servarr_ui_password before deploying the Servarr stack.
  no_log: true

- name: Create Compose secrets directory
  ansible.builtin.file:
    path: "{{ servarr_conf_dir }}/secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install Servarr UI password secret
  ansible.builtin.copy:
    content: "{{ servarr_ui_password }}\n"
    dest: "{{ servarr_conf_dir }}/secrets/ui_password"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install Servarr bootstrap script
  ansible.builtin.template:
    src: bootstrap-servarr.sh.j2
    dest: "{{ servarr_conf_dir }}/bootstrap-servarr.sh"
    owner: root
    group: root
    mode: "0755"

- name: Install Servarr Docker Compose definition
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ servarr_conf_dir }}/docker-compose.yaml"
    owner: "{{ servarr_user }}"
    group: "{{ servarr_group }}"
    mode: "0644"

- name: Start Servarr Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ servarr_conf_dir }}"
    files:
      - docker-compose.yaml
    state: present
