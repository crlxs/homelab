- name: Create Debian template VM with Cloud-init and drive
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ proxmox_template_vmid }}"
    name: "{{ proxmox_template_name }}"
    description: "{{ proxmox_template_description }}"
    ostype: l26
    cores: "{{ proxmox_template_cores }}"
    memory: "{{ proxmox_template_memory }}"
    scsihw: virtio-scsi-single
    serial:
      serial0: socket
    agent: "1"
    ciuser: "{{ debian_cloud_user | default('debian') }}"
    sshkeys: "{{ debian_cloud_user_public_key }}"
    ide:
      ide2: "{{ proxmox_template_cloudinit_storage }}:cloudinit,format=raw"
    boot: order=scsi0
    state: present
  delegate_to: localhost

- name: Import Debian cloud image as the template root disk (scsi0)
  community.proxmox.proxmox_disk:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    vmid: "{{ proxmox_template_vmid }}"
    disk: scsi0
    storage: "{{ proxmox_template_disk_storage }}"
    import_from: "{{ proxmox_cloud_image_storage }}:import/{{ debian_cloud_image_name }}"
    timeout: 600
    state: present
  delegate_to: localhost

