proxmox_template_vmid: 9000
proxmox_template_name: debian-13-cloud-init-template
proxmox_template_description: Debian 13 cloud-init template

# Pin this to a dated release directory once the setup works, e.g.
# https://cloud.debian.org/images/cloud/trixie/20250911-2233/debian-13-genericcloud-amd64-20250911-2233.qcow2
debian_cloud_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
debian_cloud_image_name: "{{ debian_cloud_image_url | basename }}"

# Optional checksum verification of the downloaded image, e.g.
# debian_cloud_image_checksum: "sha512:https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS"
debian_cloud_image_checksum: ""

# Where the image is downloaded on the Ansible controller before upload.
debian_cloud_image_path: "/tmp/{{ debian_cloud_image_name }}"

proxmox_template_disk_storage: local-lvm
proxmox_template_cloudinit_storage: local-lvm
proxmox_template_memory: 2048
proxmox_template_cores: 2

# Cloud init user config
debian_cloud_user: ansible
debian_cloud_user_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJM2onmBkkExGvD5kY1nhCcCHjPVoDkSb9gqfEwFCrt+ elon@tesla.com"
