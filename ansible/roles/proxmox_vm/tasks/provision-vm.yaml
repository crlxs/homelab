- name: "Clone {{ vm.name }} from the Debian cloud-init template"
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    clone: "{{ proxmox_vm_template_name }}"
    newid: "{{ vm.vmid }}"
    name: "{{ vm.name }}"
    full: true
    storage: "{{ proxmox_storage }}"
    timeout: 600
    state: present

- name: "Resize {{ vm.name }} root disk"
  community.proxmox.proxmox_disk:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    vmid: "{{ vm.vmid }}"
    disk: scsi0
    size: "{{ vm.disk_size }}"
    state: resized
  when: vm.disk_size is defined

- name: "Configure {{ vm.name }} cloud-init and hardware"
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ vm.vmid }}"
    cores: "{{ vm.cores }}"
    memory: "{{ vm.memory }}"
    onboot: "{{ vm.onboot | default(true) }}"
    agent: "1"
    ciuser: "{{ ansible_user_name }}"
    sshkeys: "{{ ansible_user_public_key }}"
    nameservers: "{{ proxmox_vm_nameservers }}"
    net:
      net0: "virtio,bridge={{ proxmox_bridge }}"
    ipconfig:
      ipconfig0: "ip={{ vm.ip }},gw={{ vm.gateway }}"
    update: true
    update_unsafe: true

- name: "Start {{ vm.name }}"
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ vm.vmid }}"
    state: started
