- name: Prepare shared storage and provision native Servarr LXCs
  hosts: proxmox
  gather_facts: true

  pre_tasks:
    - name: Locate the controller-local secrets file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../inventory/servarr.local.yaml"
      delegate_to: localhost
      become: false
      register: servarr_local_secrets
      tags: always

    - name: Require private permissions on the local secrets file
      ansible.builtin.assert:
        that:
          - servarr_local_secrets.stat.mode == '0600'
        fail_msg: Run chmod 600 inventory/servarr.local.yaml before deploying.
      when: servarr_local_secrets.stat.exists
      tags: always

    - name: Load private credentials without interactive prompts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/servarr.local.yaml"
      when: servarr_local_secrets.stat.exists
      no_log: true
      tags: always

  roles:
    - role: proxmox_lxc

- name: Install native applications in the Servarr LXCs
  hosts: servarr_lxcs
  gather_facts: false
  # pct executes as root inside the guest; sudo is used only on the PVE host.
  become: false
  pre_tasks:
    - name: Install Python in minimal Debian container templates
      ansible.builtin.raw: test -x /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      register: servarr_python
      changed_when: "'Setting up python3' in servarr_python.stdout"

    - name: Gather guest facts
      ansible.builtin.setup:

  roles:
    - role: servarr

- name: Connect and bootstrap the native Servarr services
  hosts: sabnzbd
  gather_facts: false
  become: false
  tasks:
    - name: Configure authentication, root folders, provider and integrations
      ansible.builtin.include_role:
        name: servarr
        tasks_from: bootstrap.yaml

    - name: Configure Jellyfin and connect Jellyseerr to its media server
      ansible.builtin.include_role:
        name: servarr
        tasks_from: jellyfin-bootstrap.yaml

- name: Deploy the homelab dashboard
  ansible.builtin.import_playbook: 02-deploy-homarr.yaml
