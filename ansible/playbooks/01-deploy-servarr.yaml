- name: Prepare shared storage and provision native Servarr LXCs
  hosts: proxmox
  gather_facts: true

  vars_prompt:
    - name: servarr_ui_password
      prompt: "Enter the password for the Servarr UI user"
      private: true
      confirm: true
    - name: sabnzbd_ui_username
      prompt: "Enter the SABnzbd UI username"
      private: false
      default: admin
    - name: sabnzbd_provider_name
      prompt: "Enter a name for the Usenet provider"
      private: false
      default: primary
    - name: sabnzbd_provider_host
      prompt: "Enter the Usenet provider hostname"
      private: false
    - name: sabnzbd_provider_port
      prompt: "Enter the Usenet provider port"
      private: false
      default: "563"
    - name: sabnzbd_provider_username
      prompt: "Enter the Usenet provider username"
      private: true
    - name: sabnzbd_provider_password
      prompt: "Enter the Usenet provider password"
      private: true
      confirm: true
    - name: sabnzbd_provider_connections
      prompt: "Enter the provider's allowed simultaneous connections"
      private: false
      default: "10"

  roles:
    - role: proxmox_lxc

- name: Install native applications in the Servarr LXCs
  hosts: servarr_lxcs
  gather_facts: false
  # pct executes as root inside the guest; sudo is used only on the PVE host.
  become: false
  pre_tasks:
    - name: Install Python in minimal Debian container templates
      ansible.builtin.raw: test -x /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      register: servarr_python
      changed_when: "'Setting up python3' in servarr_python.stdout"

    - name: Gather guest facts
      ansible.builtin.setup:

  roles:
    - role: servarr

- name: Connect and bootstrap the native Servarr services
  hosts: sabnzbd
  gather_facts: false
  become: false
  tasks:
    - name: Configure authentication, root folders, provider and integrations
      ansible.builtin.include_role:
        name: servarr
        tasks_from: bootstrap.yaml
