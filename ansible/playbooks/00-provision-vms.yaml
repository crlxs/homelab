- name: Provision homelab VMs from the golden image template
  hosts: proxmox
  gather_facts: false

  roles:
    - role: proxmox_vm

  post_tasks:
    # Only VMs with a static ip can be reached deterministically; DHCP VMs
    # must be added to inventory/hosts.yaml manually once their IP is known.
    - name: Add provisioned VMs to the in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: provisioned_vms
        ansible_host: "{{ item.ip | split('/') | first }}"
        ansible_become: true
      loop: "{{ proxmox_vms | selectattr('ip', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

