# Proxmox API connection settings.
# The token secret is NOT stored here. Provide it via one of:
#   - an ansible-vault encrypted file (inventory/group_vars/proxmox/vault.yaml), or
#   - the PROXMOX_TOKEN_SECRET environment variable.
proxmox_api_host: 192.168.1.100
proxmox_api_user: ansible@pve # create a dedicated user in the proxmox UI
proxmox_api_token_id: ansible
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret | default(lookup('env', 'PROXMOX_TOKEN_SECRET')) }}"
proxmox_node: pve
proxmox_validate_certs: false

# VM definitions provisioned by playbooks/00-provision-vms.yaml.
# See roles/proxmox_vm/defaults/main.yaml for the supported keys and defaults.
# 
# Dont forget to add the VMs to hosts.yaml, its not the best approach but works.
proxmox_vms:
  - name: test
    vmid: 110
    ip: 192.168.1.169/24
    gateway: 192.168.1.1
    cores: 2
    memory: 2048
    disk_size: 32G
    onboot: true

  - name: shiet
    vmid: 111
    ip: 192.168.1.170/24
    gateway: 192.168.1.1
    cores: 4
    memory: 4096
    #disk_size: 32G
    onboot: true

  - name: servarr
    vmid: 120
    ip: 192.168.1.200/24
    gateway: 192.168.1.1
    cores: 4
    memory: 4096
    #disk_size: 32G
    onboot: true
