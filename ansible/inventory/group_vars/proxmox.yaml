# Proxmox API connection settings.
# The token secret is NOT stored here. Provide it via one of:
#   - an ansible-vault encrypted file (inventory/group_vars/proxmox/vault.yaml), or
#   - the PROXMOX_TOKEN_SECRET environment variable.
proxmox_api_host: 192.168.1.100
proxmox_api_user: ansible@pve # create a dedicated user in the proxmox UI
proxmox_api_token_id: ansible
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret | default(lookup('env', 'PROXMOX_TOKEN_SECRET')) }}"
proxmox_node: pve
proxmox_validate_certs: false

# VM definitions provisioned by playbooks/00-provision-vms.yaml.
# See roles/proxmox_vm/defaults/main.yaml for the supported keys and defaults.
# 
# Dont forget to add the VMs to hosts.yaml, its not the best approach but works.
proxmox_vms: []
  # - name: shiet
  #   vmid: 111
  #   ip: 192.168.1.170/24
  #   gateway: 192.168.1.1
  #   cores: 4
  #   memory: 4096
  #   #root_disk_size: 32G
  #   onboot: true
  #
# Native Servarr LXCs. Confirm IDs, IPs and storage names before deployment.
# No reuse of VM 120 or its IP; the VM is left available during migration.
servarr_lxc_template_storage: local
servarr_lxc_storage: local-lvm
servarr_lxc_bridge: vmbr0
servarr_lxc_gateway: 192.168.1.1
servarr_lxc_nameserver: 8.8.8.8
# Optional: mount an EXISTING filesystem on PVE and persist it in fstab.
# Set this only after detaching the media disk/filesystem from the old VM.
# Empty means the filesystem must already be mounted at servarr_host_media_dir.
servarr_host_media_dir: /media-pool # Directory on the proxmox hosts to be mounted by the LXCs were the media files will be stored
servarr_media_uuid: ""
servarr_media_fstype: ext4
# Select a Debian 13 standard template from `pveam available`. An empty value
# discovers and downloads the current Debian 13 amd64 template automatically.
servarr_lxc_template: ""
servarr_lxcs:
  - name: radarr
    vmid: 121
    ip: 192.168.1.201/24
    cores: 2
    memory: 1024
    disk: 8
    media: true
  - name: sonarr
    vmid: 122
    ip: 192.168.1.202/24
    cores: 2
    memory: 1024
    disk: 8
    media: true
  - name: prowlarr
    vmid: 123
    ip: 192.168.1.203/24
    cores: 1
    memory: 512
    disk: 8
    media: false
  - name: sabnzbd
    vmid: 124
    ip: 192.168.1.204/24
    cores: 4
    memory: 2048
    disk: 8
    media: true
  - name: jellyseerr
    vmid: 125
    ip: 192.168.1.205/24
    cores: 2
    memory: 4096 # Next.js source build needs more RAM than normal operation.
    disk: 16
    media: false
  - name: jellyfin
    vmid: 126
    ip: 192.168.1.206/24
    cores: 4
    memory: 4096
    disk: 16
    media: true

# Share the host's NVIDIA GPU; only matching userspace drivers are installed
# inside Jellyfin. Host kernel modules/drivers are not changed by the role.
jellyfin_nvidia_enabled: true

# Independent dashboard LXC; no media bind mount or Docker nesting needed.
homarr_lxc:
  name: homarr
  vmid: 127
  ip: 192.168.1.207/24
  cores: 2
  memory: 2048
  disk: 12
