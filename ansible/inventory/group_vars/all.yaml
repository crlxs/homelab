# Variables shared across the whole inventory.

# User created by cloud-init inside guest VMs and used by Ansible over SSH.
ansible_user_name: ansible
ansible_user_public_key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/homelab_ansible.pub') }}"
ansible_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/homelab_ansible' }}"

# DNS servers configured on provisioned guests (Technitium on the pi).
homelab_dns_servers:
  - 192.168.1.100
