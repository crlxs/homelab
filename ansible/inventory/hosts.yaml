all:
  children:
    # Proxmox provisioning plays run locally against the Proxmox API.
    proxmox:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # Guest VMs are added dynamically by playbooks/10-provision-vms.yaml
    # (add_host into the "provisioned_vms" group). Add static entries here
    # once VMs are permanent and you want to manage them directly, e.g.:
    #
    # vms:
    #   hosts:
    #     media:
    #       ansible_host: 172.17.0.100
    #       ansible_user: ansible
    #       ansible_become: true
